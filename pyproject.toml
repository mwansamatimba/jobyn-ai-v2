[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobyn-ai"
version = "2.0.0"
description = "Jobyn AI v2 backend API - AI-powered career platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Jobyn" }]

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "gunicorn==23.0.0",
    "sqlalchemy[asyncio]==2.0.51",
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "aiosqlite==0.22.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "PyJWT==2.13.0",
    "bcrypt==4.3.0",
    "email-validator==2.3.0",
    "greenlet==3.5.4",
    "celery[redis]==5.6.3",
    "redis==5.3.1",
    "pypdf>=5.0,<7.0",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "openai==3.3.1",
    "firebase-admin==7.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.7,<1.0",
    "black>=24.0,<26.0",
    "mypy>=1.13,<2.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
